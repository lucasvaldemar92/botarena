<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cardápio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-dark: #111b21;
            --accent-green: #25d366;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .page-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-header__left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .page-header__icon {
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .page-header__title h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .page-header__title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .page-header__actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn--primary {
            background: var(--accent-dark);
            color: white;
        }

        .btn--primary:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .btn--outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn--outline:hover {
            background: #f1f5f9;
        }

        .btn--danger {
            background: transparent;
            color: #ef4444;
            border: 1px solid #fecaca;
        }

        .btn--danger:hover {
            background: #fef2f2;
        }

        /* ── CONTENT ── */
        .page-content {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 4rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .empty-state strong {
            color: var(--text-main);
        }

        /* ── ITEM LIST ── */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.125rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: var(--transition);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-card:hover {
            border-color: #cbd5e1;
            box-shadow: var(--shadow-sm);
        }

        .item-card__info {
            flex: 1;
            min-width: 0;
        }

        .item-card__category {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .item-card__name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-card__desc {
            font-size: 0.83rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-card__right {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-shrink: 0;
        }

        .item-card__price {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
        }

        .item-card__badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 100px;
        }

        .item-card__badge--on {
            background: #f0fdf4;
            color: #166534;
        }

        .item-card__badge--off {
            background: #fef2f2;
            color: #991b1b;
        }

        .item-card__actions {
            display: flex;
            gap: 0.25rem;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .icon-btn.icon-btn--danger:hover {
            background: #fef2f2;
            color: #ef4444;
            border-color: #fecaca;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 480px;
            margin: 1rem;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal__header {
            padding: 1.5rem 1.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal__header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal__close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .modal__close:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .modal__body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal__footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* ── FORM ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-input,
        .form-textarea,
        .form-select {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.625rem 0.875rem;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            background: var(--card-bg);
            transition: var(--transition);
            outline: none;
            width: 100%;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 3px rgba(17, 27, 33, 0.08);
        }

        .form-textarea {
            resize: vertical;
            min-height: 72px;
        }

        .form-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0.875rem;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
        }

        .form-toggle-label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #cbd5e1;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background: var(--accent-green);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .switch--small {
            width: 32px;
            height: 18px;
        }

        .switch--small .slider:before {
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
        }

        .switch--small input:checked+.slider:before {
            transform: translateX(14px);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.875rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: var(--shadow-md);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            transform: translateY(120%);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 320px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            font-size: 1rem;
        }

        .toast--success i {
            color: #22c55e;
        }

        .toast--delete i {
            color: #ef4444;
        }


        /* -- CATEGORY GROUP E TABLE -- */
        .category-group {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.3s ease, filter 0.3s ease;
        }
        
        .category-group--disabled {
            opacity: 0.55;
            filter: grayscale(0.8);
            pointer-events: none;
        }
        
        .category-group--disabled .category-group__header-actions {
            pointer-events: auto; /* Permite clicar no switch mesmo se a categoria estiver desativada */
        }

        .category-group__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        .category-group__title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .category-group__count {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            background: #e2e8f0;
            padding: 0.2rem 0.6rem;
            border-radius: 100px;
        }

        .category-group__table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .category-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .category-table th {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.875rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .category-table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .category-table tbody tr:last-child td {
            border-bottom: none;
        }

        .category-table tbody tr {
            transition: background 0.2s ease;
        }

        .category-table tbody tr:hover {
            background: #f8fafc;
        }

        .item-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .page-header {
                padding: 1rem;
            }

            .page-content {
                padding: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                max-width: none;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="page-header">
        <div class="page-header__left">
            <div class="page-header__icon">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <div class="page-header__title">
                <h1>Cadastro de Cardápio</h1>
                <p id="item-count">0 itens cadastrado(s)</p>
            </div>
        </div>
        <div class="page-header__actions">
            <button class="btn btn--outline" onclick="window.location.href='admin.html'">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <button class="btn btn--outline" id="btn-nova-categoria" style="margin-right: 0.5rem;">
                <i class="fa-solid fa-tags"></i> Categoria
            </button>
            <button class="btn btn--primary" id="btn-novo-item">
                <i class="fa-solid fa-plus"></i> Novo item
            </button>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="page-content">

        <!-- Estado vazio (visível por padrão) -->
        <div class="empty-state" id="empty-state">
            <p>Nenhum item cadastrado ainda. Clique em <strong>Novo item</strong> para começar.</p>
        </div>

        <!-- Lista de itens (oculta enquanto vazia) -->
        <div class="item-list" id="item-list" style="display:none;"></div>

    </main>

    <!-- MODAL: Novo / Editar item -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal__header">
                <h2 id="modal-title">Novo item</h2>
                <button class="modal__close" id="modal-close" aria-label="Fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal__body">
                <input type="hidden" id="item-edit-id">

                <div class="form-group">
                    <label class="form-label" for="item-name">Nome do item *</label>
                    <input class="form-input" type="text" id="item-name" placeholder="Ex: Pizza Margherita">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="item-category">Categoria</label>
                        <select class="form-select" id="item-category">
                            <option value="">Sem categoria</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="item-price">Preço (R$) *</label>
                        <input class="form-input" type="text" id="item-price" placeholder="0,00" inputmode="decimal">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="item-desc">Descrição</label>
                    <textarea class="form-textarea" id="item-desc"
                        placeholder="Descreva o item brevemente..."></textarea>
                </div>

                <div class="form-toggle-row">
                    <span class="form-toggle-label">Disponível</span>
                    <label class="switch">
                        <input type="checkbox" id="item-available" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--outline" id="modal-cancel">Cancelar</button>
                <button class="btn btn--primary" id="modal-save">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Nova Categoria -->
    <div class="modal-overlay" id="modal-category-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-category-title">
            <div class="modal__header">
                <h2 id="modal-category-title">Nova Categoria</h2>
                <button class="modal__close" id="modal-category-close" aria-label="Fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal__body">
                <input type="hidden" id="category-edit-id">

                <div class="form-group">
                    <label class="form-label" for="category-name">Nome da Categoria *</label>
                    <input class="form-input" type="text" id="category-name" placeholder="Ex: Bebidas, Pizzas, Açaí">
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--outline" id="modal-category-cancel">Cancelar</button>
                <button class="btn btn--primary" id="modal-category-save">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg"></span>
    </div>

    <script src="src/assets/js/utils.js"></script>
    <script src="cardapio_app.js"></script>
</body>

</html>
