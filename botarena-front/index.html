<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | BotArena</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Theme & Global Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light login-container">

    <main class="login-card fade-in-section">
        <!-- 🎨 Brand / Typography Header -->
        <div class="login-brand">
            <div class="login-brand__logo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="login-brand__title">BotArena</h1>
            <p class="login-brand__subtitle">Hub de Atendimento Inteligente</p>
        </div>

        <!-- 🛠️ Dynamic Tab Switcher (Inspired by Design) -->
        <div class="login-tabs" role="tablist">
            <button class="login-tab login-tab--active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form">Entrar</button>
            <button class="login-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="login-form">Criar conta</button>
        </div>

        <!-- 🛡️ Inline Feedback Error Anchor -->
        <div id="auth-error-banner" class="auth-error-banner" role="alert" aria-live="assertive">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="auth-error-message"></span>
        </div>

        <!-- 📝 Secure Interactive Authentication Form -->
        <form id="login-form" novalidate>
            <!-- Email Field -->
            <div class="login-form__group">
                <label for="email" class="login-form__label">Email</label>
                <div class="login-form__input-wrapper">
                    <i class="fa-regular fa-envelope login-form__icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        class="login-form__input" 
                        placeholder="voce@exemplo.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <!-- Password Field -->
            <div class="login-form__group">
                <label for="password" class="login-form__label">Senha</label>
                <div class="login-form__input-wrapper">
                    <i class="fa-regular fa-lightbulb login-form__icon" style="transform: rotate(180deg); margin-left: 2px;"></i>
                    <input 
                        type="password" 
                        id="password" 
                        class="login-form__input" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                    <!-- Password Visibility Toggle Icon -->
                    <button 
                        type="button" 
                        id="toggle-password-visibility" 
                        class="login-form__toggle-pwd" 
                        aria-label="Mostrar senha"
                    >
                        <i class="fa-regular fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Primary High-Contrast Button (Loading Aware) -->
            <button type="submit" id="submit-btn" class="login-button">
                <span id="btn-text">Entrar</span>
                <i class="fa-solid fa-arrow-right-to-bracket" id="btn-icon"></i>
            </button>
        </form>

        <!-- Divider Line -->
        <div class="login-divider">
            <span class="login-divider__text">Ou continue com</span>
        </div>

        <!-- Google OAuth Authentication Button -->
        <button type="button" id="google-auth-btn" class="login-oauth">
            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Continuar com Google</span>
        </button>
    </main>

    <!-- Core App Auth Utilities -->
    <script src="src/assets/js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePwdBtn = document.getElementById('toggle-password-visibility');
            const eyeIcon = document.getElementById('eye-icon');
            const errorBanner = document.getElementById('auth-error-banner');
            const errorMessage = document.getElementById('auth-error-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            // Toggle active tabs visually
            const switchTab = (activeTab, inactiveTab) => {
                activeTab.classList.add('login-tab--active');
                activeTab.setAttribute('aria-selected', 'true');
                inactiveTab.classList.remove('login-tab--active');
                inactiveTab.setAttribute('aria-selected', 'false');
                hideError();
            };

            tabLogin.addEventListener('click', () => switchTab(tabLogin, tabSignup));
            tabSignup.addEventListener('click', () => {
                switchTab(tabSignup, tabLogin);
                showError('A criação de contas externas está suspensa no momento.');
            });

            // 👁️ Compliance: Toggle Password Visibility
            togglePwdBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                
                // Update icon representation
                eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                togglePwdBtn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
            });

            // Display Error dynamic banner
            function showError(message) {
                errorMessage.textContent = message;
                errorBanner.style.display = 'flex';
            }

            // Hide Error banner
            function hideError() {
                errorBanner.style.display = 'none';
                errorMessage.textContent = '';
            }

            // 📝 Secure Authentication Logic
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                // Basic validation client-side
                if (!email) {
                    showError('Por favor, informe seu endereço de e-mail.');
                    emailInput.focus();
                    return;
                }
                if (!password) {
                    showError('Por favor, informe sua senha de acesso.');
                    passwordInput.focus();
                    return;
                }

                // 🛠️ Lock state handling & display loading indicator
                submitBtn.disabled = true;
                const originalText = btnText.textContent;
                const originalIconClass = btnIcon.className;

                btnText.textContent = 'Carregando...';
                btnIcon.className = 'spinner';

                try {
                    // Call the secure auth gateway
                    const response = await fetch(`${window.BASE_URL}/api/auth/dev-login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({ error: 'Falha na autenticação.' }));
                        throw new Error(errData.error || 'Credenciais inválidas.');
                    }

                    const data = await response.json();
                    
                    // Persist authentication state
                    localStorage.setItem('botarena-token', data.token);
                    
                    // Redirect to cockpit panel
                    window.location.href = '/painel-administrativo.html';
                } catch (err) {
                    console.error('❌ [Login] Auth failure:', err);
                    showError(err.message || 'Falha ao conectar ao servidor. Tente novamente.');
                    
                    // Unlock button
                    submitBtn.disabled = false;
                    btnText.textContent = originalText;
                    btnIcon.className = originalIconClass;
                }
            });

            // Mock Google auth integration feedback
            document.getElementById('google-auth-btn').addEventListener('click', () => {
                showError('A integração com o Google OAuth está indisponível para esta versão.');
            });
        });
    </script>
</body>
</html>
