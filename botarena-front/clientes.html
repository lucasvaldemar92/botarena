<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | BotArena</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-dark: #111b21;
            --accent-green: #25d366;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            font-family: 'Outfit', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header__title h1 {
            font-size: 1.875rem;
            font-weight: 700;
        }

        .header__title p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .header__actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: var(--accent-dark);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn--outline {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn--sync {
            background: var(--accent-green);
            color: white;
        }

        .btn--sync:hover {
            background: #1ebe57;
        }

        /* Table Styles */
        .card-table {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #fcfdfe;
            padding: 1.25rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1.25rem 1.5rem;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal__content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.active .modal__content {
            transform: translateY(0);
        }

        .modal__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal__header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .modal__close {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group--full {
            grid-column: span 2;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
        }

        /* Badge Styles */
        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.625rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .source-badge--manual {
            background: #f1f5f9;
            color: #475569;
        }

        .source-badge--whatsapp {
            background: #f0fdf4;
            color: #16a34a;
        }

        @keyframes sync-flash {
            0% { background-color: rgba(37, 211, 102, 0.2); }
            100% { background-color: transparent; }
        }

        .sync-flash {
            animation: sync-flash 1s ease-out;
        }

        /* Modal Grid Layout */
        .modal__body-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal__content {
            background: #ffffff;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 550px;
            border-radius: var(--radius-lg, 16px);
            padding: 2.25rem;
            box-shadow: var(--shadow-md);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            color: var(--text-main);
        }

        /* Responsividade */
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .header__actions { width: 100%; }
            .btn { flex: 1; }
        }

        /* ── Search & Filters ── */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .toolbar__top {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-box__icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
            pointer-events: none;
        }

        .search-box__input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            background: white;
            transition: var(--transition);
            box-sizing: border-box;
        }

        .search-box__input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        /* Filter dropdown buttons */
        .filters-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.875rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: white;
            font-size: 0.875rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: #7c3aed;
            color: #7c3aed;
        }

        .filter-btn.active {
            border-color: #7c3aed;
            color: #7c3aed;
            background: #f5f3ff;
        }

        .filter-btn__count {
            background: #7c3aed;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 100px;
            min-width: 18px;
            text-align: center;
        }

        .filter-btn__chevron {
            font-size: 0.7rem;
            transition: transform 0.2s ease;
            color: var(--text-muted);
        }

        .filter-btn.open .filter-btn__chevron {
            transform: rotate(180deg);
        }

        /* Dropdown panel */
        .filter-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 500;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            min-width: 200px;
            max-height: 280px;
            overflow-y: auto;
            padding: 0.5rem 0;
            display: none;
        }

        .filter-dropdown.open {
            display: block;
            animation: dropdownFadeIn 0.15s ease;
        }

        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .filter-dropdown__item {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.55rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-main);
            transition: background 0.15s ease;
        }

        .filter-dropdown__item:hover {
            background: #f8fafc;
        }

        .filter-dropdown__item input[type="checkbox"] {
            accent-color: #7c3aed;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .filter-dropdown__empty {
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Active tags */
        .active-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .active-tags:empty {
            display: none;
        }

        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.3rem 0.625rem;
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #5b21b6;
            transition: var(--transition);
        }

        .filter-tag__remove {
            background: none;
            border: none;
            cursor: pointer;
            color: #7c3aed;
            padding: 0;
            display: flex;
            align-items: center;
            font-size: 0.7rem;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .filter-tag__remove:hover {
            opacity: 1;
        }

        .results-counter {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 0 0.25rem;
        }

        .results-counter strong {
            color: #7c3aed;
            font-weight: 700;
        }

        .empty-state--filter {
            padding: 3rem 2rem;
            text-align: center;
        }

        .empty-state--filter i {
            font-size: 2.5rem;
            color: #ddd6fe;
            margin-bottom: 1rem;
            display: block;
        }

        .empty-state--filter p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .empty-state--filter span {
            font-size: 0.85rem;
            color: #a78bfa;
        }

        /* Estilos de Paginação */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-top: 1px solid var(--border-color);
            background: #fcfdfe;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pagination__info {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .pagination__select {
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-main);
            outline: none;
            background: white;
            cursor: pointer;
            transition: var(--transition);
        }

        .pagination__select:focus {
            border-color: var(--accent-green);
        }

        .pagination__buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .pagination__btn {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.875rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .pagination__btn:hover:not(:disabled) {
            background: var(--bg-color);
            border-color: var(--text-muted);
        }

        .pagination__btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination__page {
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0.5rem 0.875rem;
            border-radius: var(--radius-md);
            background: var(--accent-dark);
            color: white;
            border: 1px solid var(--accent-dark);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header__title">
                <h1>Clientes</h1>
                <p id="client-count">0 cadastrados</p>
            </div>
            <div class="header__actions">
                <a href="painel-administrativo.html" class="btn btn--outline" id="btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </a>
                <button class="btn btn--sync" id="btn-sync-whatsapp">
                    <i class="fa-solid fa-rotate"></i> Sincronizar
                </button>
                <button class="btn" id="btn-new-client" data-testid="btn-new-client">
                    <i class="fa-solid fa-plus"></i> Novo cliente
                </button>
            </div>
        </header>

        <!-- ── Toolbar: busca + filtros ── -->
        <div class="toolbar">
            <div class="toolbar__top">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-box__icon"></i>
                    <input type="text" id="client-search" class="search-box__input"
                        placeholder="Buscar por nome, telefone, endereço..."
                        data-testid="client-search-input" autocomplete="off">
                </div>
            </div>

            <div class="filters-row">
                <!-- Filtro: Contato -->
                <div class="filter-btn" id="filter-btn-source" data-filter="source">
                    <i class="fa-solid fa-mobile-screen-button" style="font-size:0.8rem;"></i>
                    Contato
                    <span class="filter-btn__count" id="filter-count-source" style="display:none;"></span>
                    <i class="fa-solid fa-chevron-down filter-btn__chevron"></i>
                    <div class="filter-dropdown" id="filter-dropdown-source">
                        <label class="filter-dropdown__item">
                            <input type="checkbox" value="manual" data-filter="source"> Manual
                        </label>
                        <label class="filter-dropdown__item">
                            <input type="checkbox" value="whatsapp" data-filter="source"> WhatsApp
                        </label>
                    </div>
                </div>

                <!-- Filtro: Bairro / Região -->
                <div class="filter-btn" id="filter-btn-neighborhood" data-filter="neighborhood">
                    <i class="fa-solid fa-location-dot" style="font-size:0.8rem;"></i>
                    Bairro / Região
                    <span class="filter-btn__count" id="filter-count-neighborhood" style="display:none;"></span>
                    <i class="fa-solid fa-chevron-down filter-btn__chevron"></i>
                    <div class="filter-dropdown" id="filter-dropdown-neighborhood">
                        <div class="filter-dropdown__empty">Carregando...</div>
                    </div>
                </div>

                <!-- Filtro: Endereço / Rua -->
                <div class="filter-btn" id="filter-btn-address" data-filter="address">
                    <i class="fa-solid fa-road" style="font-size:0.8rem;"></i>
                    Endereço / Rua
                    <span class="filter-btn__count" id="filter-count-address" style="display:none;"></span>
                    <i class="fa-solid fa-chevron-down filter-btn__chevron"></i>
                    <div class="filter-dropdown" id="filter-dropdown-address">
                        <div class="filter-dropdown__empty">Carregando...</div>
                    </div>
                </div>

                <!-- Filtro: CEP -->
                <div class="filter-btn" id="filter-btn-zip" data-filter="zip">
                    <i class="fa-solid fa-signs-post" style="font-size:0.8rem;"></i>
                    CEP
                    <span class="filter-btn__count" id="filter-count-zip" style="display:none;"></span>
                    <i class="fa-solid fa-chevron-down filter-btn__chevron"></i>
                    <div class="filter-dropdown" id="filter-dropdown-zip">
                        <div class="filter-dropdown__empty">Carregando...</div>
                    </div>
                </div>
            </div>

            <!-- Tags ativas + contador de resultados -->
            <div id="active-tags-row" style="display:none;">
                <div class="active-tags" id="active-tags"></div>
                <span class="results-counter" id="results-counter"></span>
            </div>
        </div>

        <main class="card-table">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Nascimento</th>
                            <th>Telefone</th>
                            <th>Contato</th>
                            <th>Bairro / Região</th>
                            <th>Endereço / Rua</th>
                            <th>CEP</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clients-table-body">
                        <tr>
                            <td colspan="8" class="empty-state">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Controles de Paginação -->
            <div class="pagination" id="pagination-controls" style="display: none;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span class="pagination__info" id="pagination-info">Mostrando 1-10 de 0 clientes</span>
                    <select id="pagination-limit" class="pagination__select" data-testid="pagination-limit-select">
                        <option value="10" selected>10 por página</option>
                        <option value="25">25 por página</option>
                        <option value="50">50 por página</option>
                        <option value="all">Ver todos</option>
                    </select>
                </div>
                <div class="pagination__buttons">
                    <button class="pagination__btn" id="btn-prev-page" disabled>
                        <i class="fa-solid fa-chevron-left"></i> Anterior
                    </button>
                    <span class="pagination__page" id="current-page-num">1</span>
                    <button class="pagination__btn" id="btn-next-page" disabled>
                        Próximo <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Cadastro -->
    <div class="modal" id="modal-registration">
        <div class="modal__content">
            <header class="modal__header">
                <h2 id="modal-title">Cadastro de Cliente</h2>
                <button class="modal__close" id="modal-close">&times;</button>
            </header>

            <div class="modal__body-grid">
                <!-- Coluna Única: Formulário Manual -->
                <div class="modal-col modal-col--form">
                    <div id="client-source-badge" class="source-badge source-badge--manual" style="margin-bottom: 1.25rem;">
                        <i class="fa-solid fa-pen"></i> [Manual]
                    </div>

                    <form id="form-client">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="client-name">Nome do Cliente</label>
                                <input type="text" id="client-name" class="form-input" placeholder="Ex: João Silva" data-testid="client-name-input" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="client-birth">Data de Nascimento</label>
                                <input type="date" id="client-birth" class="form-input" data-testid="client-birth-input">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="client-phone">WhatsApp/Telefone</label>
                                <input type="text" id="client-phone" class="form-input" placeholder="Ex: 5517999999999" data-testid="client-phone-input" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="client-cep">CEP</label>
                                <input type="text" id="client-cep" class="form-input" placeholder="00000-000" data-testid="client-cep-input">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="client-neighborhood">Bairro / Região</label>
                                <input type="text" id="client-neighborhood" class="form-input" placeholder="Ex: Centro" data-testid="client-neighborhood-input">
                            </div>

                            <div class="form-group form-group--full">
                                <label class="form-label" for="client-address">Endereço / Rua</label>
                                <input type="text" id="client-address" class="form-input" placeholder="Ex: Av. Brasil, 120" data-testid="client-address-input">
                            </div>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                            <button type="button" class="btn btn--outline" style="flex: 1;" id="btn-cancel" data-testid="btn-cancel-client">Cancelar</button>
                            <button type="submit" class="btn" style="flex: 1;" id="btn-submit" data-testid="btn-save-client">Salvar Cliente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="src/assets/js/utils.js"></script>
    <script src="clientes_app.js"></script>
</body>
</html>
